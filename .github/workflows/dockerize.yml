name: Dockerize

on: 
  push:
    branches: 
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # auto-generated
      DOCKER_BUILDKIT: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
    # checkout repository code
    - uses: actions/checkout@v4
    
    # docker Buildx preparation
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # docker login only for main branch pushes
    - name: Login to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.dockerhub_username }}
        password: ${{ secrets.dockerhub_password }}

    # PRs: build image only (no push), so CI validates Dockerfile without registry credentials.
    - name: Build for PR validation (no push)
      if: github.event_name == 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        platforms: linux/amd64

    # Main branch pushes: build and publish Docker image.
    - name: Build and push image on main
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{secrets.dockerhub_username}}/${{secrets.dockerhub_repo_name}}:latest
        platforms: linux/amd64
        cache-from: type=registry,ref=${{secrets.dockerhub_username}}/${{secrets.dockerhub_repo_name}}:cache
        cache-to: type=inline,mode=max
